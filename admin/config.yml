backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "site-settings.json"
        label: "General Settings"
        name: "general"
        fields:
          - { label: "WhatsApp Number (customer-facing, e.g. 01410355233)", name: "whatsappNumber", widget: "string" }
          - { label: "WhatsApp Number (international format, e.g. 8801410355233)", name: "whatsappInternational", widget: "string" }
          - { label: "WhatsApp Default Message", name: "whatsappMessage", widget: "string" }
          - { label: "Inside Mymensingh Sadar — Label", name: "shippingInsideLabel", widget: "string" }
          - { label: "Inside Mymensingh Sadar — Charge (৳)", name: "shippingInsideCharge", widget: "number", value_type: "int" }
          - { label: "Outside Mymensingh Sadar — Label", name: "shippingOutsideLabel", widget: "string" }
          - { label: "Outside Mymensingh Sadar — Charge (৳)", name: "shippingOutsideCharge", widget: "number", value_type: "int" }

  - name: "products"
    label: "Products"
    files:
      - file: "products.json"
        label: "Product List"
        name: "products"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            root: true
            summary: "{{name}} — ৳{{price}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: [{label: "Gypsum (জিপসাম)", value: "gypsum"}, {label: "Resin (রেজিন)", value: "resin"}, {label: "Candle (ক্যান্ডেল)", value: "candle"}], default: "gypsum" }
              - { label: "Subcategory (optional)", name: "subcategory", widget: "string", required: false }
              - { label: "Date Added (used for Newest/Oldest sorting)", name: "dateAdded", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Tags (comma-separated, helps search)", name: "tags", widget: "string", required: false, hint: "e.g. gift, wedding, decor" }
              - { label: "SKU", name: "sku", widget: "string", required: false }
              - { label: "Short Description (Bengali) — shown on product cards", name: "description", widget: "text", required: false }
              - { label: "Full Description — shown on product page", name: "fullDescription", widget: "text", required: false }
              - { label: "Price (৳)", name: "price", widget: "number", value_type: "float" }
              - { label: "Original Price (optional — shown crossed out, leave blank for no discount badge)", name: "originalPrice", widget: "number", value_type: "float", required: false }
              - { label: "Main Photo", name: "image", widget: "image" }
              - { label: "Additional Gallery Photos (optional)", name: "gallery", widget: "list", field: { label: "Photo", name: "src", widget: "image" }, required: false }
              - { label: "In Stock", name: "inStock", widget: "boolean", default: true }
              - { label: "Stock Quantity (optional)", name: "stockQuantity", widget: "number", value_type: "int", required: false }
              - { label: "Materials (optional)", name: "materials", widget: "string", required: false }
              - { label: "Dimensions (optional)", name: "dimensions", widget: "string", required: false }
              - { label: "Weight (optional)", name: "weight", widget: "string", required: false }
              - { label: "Show in Trending (homepage)", name: "trending", widget: "boolean", default: false, required: false }
              - { label: "Mark as Best Seller", name: "bestSeller", widget: "boolean", default: false, required: false }
              - { label: "Mark as New Arrival", name: "newArrival", widget: "boolean", default: false, required: false }
              - { label: "Mark as Featured", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "Mark as Limited Stock", name: "limited", widget: "boolean", default: false, required: false }
              - { label: "SEO Title (optional)", name: "seoTitle", widget: "string", required: false }
              - { label: "SEO Description (optional)", name: "seoDescription", widget: "text", required: false }
